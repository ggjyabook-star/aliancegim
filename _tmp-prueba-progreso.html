<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba socio/progreso</title>
<link rel="stylesheet" href="css/styles.css">
<style>body{margin:0}#salida{display:none}</style>
</head>
<body>
<div id="toasts" class="toast-wrap"></div>
<div id="modales"></div>
<pre id="salida">…</pre>
<div id="vista" style="max-width:1100px;padding:12px;margin:0 auto"></div>
<div id="topbar-titulo" style="display:none"></div>

<script src="js/core/utils.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/calc.js"></script>
<script src="js/core/charts.js"></script>
<script src="js/core/db.js"></script>
<script src="js/data/exercises.js"></script>
<script src="js/data/foods.js"></script>
<script src="js/data/seed.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/router.js"></script>
<script src="js/modules/socios.js"></script>
<script src="js/modules/pagos.js"></script>
<script src="js/modules/mediciones.js"></script>
<script src="js/modules/ejercicios.js"></script>
<script src="js/modules/rutinas.js"></script>
<script src="js/modules/nutricion.js"></script>
<script src="js/modules/coaches.js"></script>
<script src="js/modules/calificaciones.js"></script>
<script src="js/modules/asistencia.js"></script>
<script src="js/modules/clases.js"></script>
<script src="js/modules/avisos.js"></script>
<script src="js/modules/reportes.js"></script>
<script src="js/modules/config.js"></script>
<script src="js/views/socio_progreso.js"></script>
<script>
(function () {
  var out = [], fallos = 0;
  function log(s) { out.push(s); }
  function chk(cond, msg) { if (cond) log('  OK   ' + msg); else { fallos++; log('  FALLA ' + msg); } }

  window.onerror = function (m, u, l) { fallos++; log('  ERROR ' + m + ' @' + l); };

  if (/tema=claro/.test(location.search)) document.documentElement.setAttribute('data-tema', 'claro');
  AG.DB.cargar(); AG.DB.sembrarSiVacio(); AG.DB.recalcularEstadoSocios();

  chk(!!(AG.Views && AG.Views.SocioProgreso), 'AG.Views.SocioProgreso existe');
  var def = AG.Router.rutas().filter(function (r) { return r.path === 'socio/progreso'; })[0];
  chk(!!def, 'ruta socio/progreso registrada');
  chk(!!def && def.roles.length === 1 && def.roles[0] === 'socio', 'roles = [socio]');
  chk(!!def && def.nav && def.nav.etiqueta === 'Mi progreso' && def.nav.icono === 'grafica' &&
      def.nav.grupo === 'Mi entrenamiento' && def.nav.orden === 2, 'nav correcto');

  var r = AG.Auth.entrar('socio@alliancegym.mx', 'socio123');
  chk(r.ok, 'sesión socio iniciada');
  var usuario = AG.Auth.actual();

  var cont = document.getElementById('vista');

  function pintar(u, etiqueta) {
    try {
      var salida = def.render({ usuario: u, params: {}, path: 'socio/progreso' });
      var html = typeof salida === 'string' ? salida : salida.html;
      chk(typeof html === 'string' && html.length > 500, etiqueta + ': html (' + Math.round(html.length / 1024) + ' KB)');
      cont.innerHTML = html;
      if (salida && typeof salida.listo === 'function') salida.listo(cont);
      chk(true, etiqueta + ': listo() sin excepciones');
      return true;
    } catch (e) {
      fallos++; log('  FALLA ' + etiqueta + ' -> ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]);
      return false;
    }
  }

  pintar(usuario, 'socio con datos');

  // Secciones esperadas
  var txt = cont.textContent;
  chk(/Mi progreso/.test(txt), 'título Mi progreso');
  chk(/Mi evolución/.test(txt), 'sección Mi evolución');
  chk(/Mi cuerpo hoy/.test(txt), 'sección Mi cuerpo hoy');
  chk(/récords de fuerza/i.test(txt), 'sección Mis récords de fuerza');
  chk(/Mi meta/.test(txt), 'sección Mi meta');
  chk(!!cont.querySelector('[data-imprimir-reporte]'), 'botón Descargar mi reporte');
  chk(!!cont.querySelector('[data-mes="-1"]') && !!cont.querySelector('[data-mes="1"]'), 'flechas de mes');
  chk(cont.querySelectorAll('.prg-medida').length === 10 || /perímetros/.test(txt), '10 medidas o vacío explicado');

  // Navegar meses hacia atrás varias veces (busca un mes cerrado y uno vacío)
  var atras = cont.querySelector('[data-mes="-1"]');
  for (var i = 0; i < 10 && atras && !atras.disabled; i++) {
    atras.click();
    atras = cont.querySelector('[data-mes="-1"]');
  }
  chk(true, 'navegación de 10 meses hacia atrás sin excepciones');
  log('  info mes final: ' + (cont.querySelector('.prg-mes') ? cont.querySelector('.prg-mes').textContent : '?'));

  var adelante = cont.querySelector('[data-mes="1"]');
  for (var j = 0; j < 12 && adelante && !adelante.disabled; j++) {
    adelante.click();
    adelante = cont.querySelector('[data-mes="1"]');
  }
  chk(true, 'navegación hacia adelante sin excepciones');

  // Cambiar de levantamiento en récords
  var marcas = cont.querySelectorAll('[data-rm]');
  log('  info marcas de fuerza: ' + marcas.length);
  for (var k = 0; k < marcas.length; k++) marcas[k].click();
  chk(true, 'cambio de levantamiento sin excepciones');
  chk(!cont.querySelector('[data-rm-tabla]') || cont.querySelector('[data-rm-tabla]').innerHTML.length > 40, 'tabla RM con contenido');

  // Mes actual
  var actual = cont.querySelector('[data-mes-actual]');
  if (actual && !actual.disabled) actual.click();
  chk(true, 'botón mes actual sin excepciones');

  // Socio sin mediciones
  var todos = AG.DB.socios();
  var sinMed = null;
  for (var s = 0; s < todos.length; s++) {
    if (!AG.DB.medicionesDe(todos[s].id).length) { sinMed = todos[s]; break; }
  }
  if (!sinMed) {
    sinMed = AG.DB.insertar('usuarios', {
      rol: 'socio', nombre: 'Prueba', apellidos: 'Sin Datos', email: 'p@p.mx', password: 'x',
      codigo: 'AG-9999', sexo: 'H', estaturaCm: 175, objetivo: 'perder_grasa', nivel: 'principiante',
      nivelActividad: 'moderado', coachId: null, estado: 'activo', activo: true, fechaAlta: AG.Utils.hoy()
    });
  }
  pintar(sinMed, 'socio sin mediciones');
  chk(/Tu progreso empieza con una medición/.test(cont.textContent), 'vacío motivador');

  // Socio con solo medición inicial del mes
  var conSocio = AG.DB.socios()[0];
  var med = AG.DB.medicionesDe(conSocio.id);
  chk(med.length > 0, 'socio 0 tiene mediciones');
  var mesLibre = AG.Utils.mesActual();
  // borrar la final del mes actual si existe, para forzar el estado "en curso"
  var finActual = AG.DB.medicionDelMes(conSocio.id, mesLibre, 'final');
  if (finActual) AG.DB.eliminar('mediciones', finActual.id);
  var iniActual = AG.DB.medicionDelMes(conSocio.id, mesLibre, 'inicial');
  if (!iniActual) {
    AG.DB.insertar('mediciones', {
      socioId: conSocio.id, coachId: conSocio.coachId, fecha: mesLibre + '-02', periodo: mesLibre,
      tipo: 'inicial', pesoKg: 80, estaturaCm: 175, grasaPct: 22, musculoKg: 34, aguaPct: 55,
      medidas: { cuello: 39, hombros: 118, pecho: 100, brazoDer: 34, brazoIzq: 34, cintura: 92,
                 cadera: 100, musloDer: 58, musloIzq: 58, pantorrilla: 38 },
      fuerza: { pressBanca: 70, sentadilla: 100, pesoMuerto: 120 },
      visibleParaSocio: true
    });
  }
  AG.Auth.salir();
  AG.Auth.entrar(conSocio.email, conSocio.password);
  pintar(AG.Auth.actual(), 'socio con mes en curso');
  chk(/coach/i.test(cont.textContent), 'tarjeta de cierre pendiente menciona al coach');

  // Reporte imprimible (sin abrir ventana): se prueba la construcción
  var imprimirOriginal = AG.Utils.imprimir;
  var llamado = false;
  AG.Utils.imprimir = function (h, t) { llamado = (typeof h === 'string' && h.length > 300 && !!t); return true; };
  try {
    AG.Views.SocioProgreso.imprimirReporte(AG.DB.usuario(conSocio.id), AG.Utils.mesActual());
    chk(llamado, 'reporte imprimible construido');
  } catch (e) { fallos++; log('  FALLA reporte -> ' + e.message); }
  AG.Utils.imprimir = imprimirOriginal;

  // Volver al socio demo y dejar la vista pintada para inspección visual
  AG.Auth.salir();
  AG.Auth.entrar('socio@alliancegym.mx', 'socio123');
  pintar(AG.Auth.actual(), 'repintado final');

  var pasos = Number((/atras=(\d+)/.exec(location.search) || [])[1]) || 0;
  for (var z = 0; z < pasos; z++) {
    var b = cont.querySelector('[data-mes="-1"]');
    if (b && !b.disabled) b.click();
  }
  var t = document.getElementById('toasts'); if (t) t.innerHTML = '';

  var solo = (/solo=([^&]+)/.exec(location.search) || [])[1];
  if (solo) {
    solo = decodeURIComponent(solo);
    var spans = [].slice.call(cont.querySelectorAll('.card-title span'));
    for (var q = 0; q < spans.length; q++) {
      if (spans[q].textContent.indexOf(solo) >= 0) {
        var card = spans[q].closest('.card');
        if (card) { cont.innerHTML = ''; cont.appendChild(card); }
        break;
      }
    }
  }

  out.unshift('RESULTADO: ' + fallos + ' fallas');
  document.getElementById('salida').textContent = out.join('\n');
  document.body.setAttribute('data-resultado', String(fallos));
  document.title = 'progreso ' + fallos + ' fallas';
  console.log(fallos ? 'PROGRESO-FALLAS ' + fallos : 'PROGRESO-OK');
  out.forEach(function (l) { if (/FALLA|ERROR|info/.test(l)) console.log(l); });
})();
</script>
</body>
</html>
